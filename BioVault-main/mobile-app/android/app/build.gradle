apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

def enableProguardInReleaseBuilds = false

android {
    namespace "com.biovault"

    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "com.biovault"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        // React Native Camera defines product flavors; pick one explicitly to satisfy variant selection.
        missingDimensionStrategy 'react-native-camera', 'general'

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildFeatures {
        buildConfig = true
    }

    packagingOptions {
        // Handle duplicate libc++_shared.so from React Native and PyTorch Mobile
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        
        // Handle duplicate libfbjni.so
        pickFirst 'lib/arm64-v8a/libfbjni.so'
        pickFirst 'lib/armeabi-v7a/libfbjni.so'
        pickFirst 'lib/x86/libfbjni.so'
        pickFirst 'lib/x86_64/libfbjni.so'
        
        // Exclude duplicate META-INF files
        exclude 'META-INF/LICENSE.md'
        exclude 'META-INF/NOTICE.md'
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation("com.facebook.react:react-android:0.73.11")
    implementation("com.facebook.react:hermes-android:0.73.11")
    
    // BioVault SDK (core functionality — consent, classification, rPPG, crypto, native)
    implementation project(':biovault-sdk')
    
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.biometric:biometric:1.2.0-alpha05"
    
    // ML Kit Image Labeling for content classification (Phase 3)
    implementation 'com.google.mlkit:image-labeling:17.0.9'

    // PyTorch Mobile for neural network inference (using 1.13.1, latest stable)
    implementation('org.pytorch:pytorch_android_lite:1.13.1') {
        exclude group: 'com.facebook.fbjni'  // Use React Native's fbjni
    }
    implementation('org.pytorch:pytorch_android_torchvision_lite:1.13.1') {
        exclude group: 'com.facebook.fbjni'
    }
    
    // Force specific fbjni version (React Native's version)
    implementation 'com.facebook.fbjni:fbjni:0.5.1'
}

// Apply native modules if available (check hoisted root node_modules too)
def nativeModulesGradle = file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
if (!nativeModulesGradle.exists()) {
    nativeModulesGradle = file("../../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
}
if (!nativeModulesGradle.exists()) {
    nativeModulesGradle = file("../../node_modules/react-native/node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
}
if (nativeModulesGradle.exists()) {
    apply from: nativeModulesGradle
    applyNativeModulesAppBuildGradle(project)
}
