buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.22"
        // Point to react-native in hoisted root node_modules for libraries that need it
        def rnDir = file("$rootDir/../node_modules/react-native")
        if (!rnDir.exists()) {
            rnDir = file("$rootDir/../../node_modules/react-native")
        }
        REACT_NATIVE_NODE_MODULES_DIR = rnDir.absolutePath
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        // React Native Gradle plugin is provided via includeBuild in settings.gradle
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // React Native Community CLI Maven repo (check hoisted root node_modules)
        def jscDir = file("$rootDir/../node_modules/jsc-android/dist")
        if (!jscDir.exists()) {
            jscDir = file("$rootDir/../../node_modules/jsc-android/dist")
        }
        maven { url(jscDir.absolutePath) }
    }

    // RN 0.73+: artifact renamed from react-native → react-android.
    // Autolinked native modules still request the old name — redirect them.
    configurations.all {
        resolutionStrategy {
            dependencySubstitution {
                substitute(module("com.facebook.react:react-native"))
                    .using(module("com.facebook.react:react-android:0.73.11"))
                    .because("RN 0.73 renamed artifact to react-android")
            }
        }
    }
}

// Ensure all subprojects (autolinked native modules) use consistent JVM target
// and have namespace set (required by AGP 8+)
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                // Auto-set namespace from AndroidManifest.xml if missing
                if (namespace == null || namespace.isEmpty()) {
                    def manifest = file("${project.projectDir}/src/main/AndroidManifest.xml")
                    if (manifest.exists()) {
                        def parsed = new XmlParser().parse(manifest)
                        def packageName = parsed.attribute("package")
                        if (packageName) {
                            namespace packageName
                        }
                    }
                }
            }
        }
        if (project.plugins.hasPlugin("org.jetbrains.kotlin.android")) {
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = "17"
                }
            }
        }
    }
}